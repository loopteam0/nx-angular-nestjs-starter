BadRequest:
  description: Bad request
  content:
    application/json:
      schema:
        $ref: "../schemas/common.yaml#/ErrorResponse"

Unauthorized:
  description: Authentication required or invalid credentials
  content:
    application/json:
      schema:
        $ref: "../schemas/common.yaml#/ErrorResponse"

Forbidden:
  description: Not authorized for this action
  content:
    application/json:
      schema:
        $ref: "../schemas/common.yaml#/ErrorResponse"

NotFound:
  description: Resource not found
  content:
    application/json:
      schema:
        $ref: "../schemas/common.yaml#/ErrorResponse"

Conflict:
  description: Conflict (e.g., uniqueness constraint)
  content:
    application/json:
      schema:
        $ref: "../schemas/common.yaml#/ErrorResponse"
