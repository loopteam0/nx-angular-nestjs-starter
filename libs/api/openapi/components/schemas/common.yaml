Id:
  type: string
  format: uuid
  description: Unique identifier.

ErrorResponse:
  type: object
  required: [error]
  properties:
    error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
          examples: ["VALIDATION_ERROR", "UNAUTHORIZED", "FORBIDDEN", "NOT_FOUND", "CONFLICT"]
        message:
          type: string
          description: Human-readable summary of what went wrong.
        details:
          description: Optional error details (field errors, context).
    requestId:
      type: string
      description: Correlation ID for troubleshooting.

PageInfo:
  type: object
  required: [page, pageSize, totalItems, totalPages]
  properties:
    page:
      type: integer
      minimum: 1
    pageSize:
      type: integer
      minimum: 1
    totalItems:
      type: integer
      minimum: 0
    totalPages:
      type: integer
      minimum: 0

CurrencyCode:
  type: string
  description: ISO-4217 currency code.
  examples: ["USD", "EUR", "GHS"]

Money:
  type: object
  required: [amount, currency]
  properties:
    amount:
      type: number
      minimum: 0
    currency:
      $ref: "./common.yaml#/CurrencyCode"

OperationStatusResponse:
  type: object
  required: [success, message]
  properties:
    success:
      type: boolean
    message:
      type: string
    referenceId:
      type: string
      format: uuid

AuditMetadata:
  type: object
  properties:
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    createdBy:
      $ref: "./common.yaml#/Id"
    updatedBy:
      $ref: "./common.yaml#/Id"
