Page:
  name: page
  in: query
  description: 1-based page index.
  required: false
  schema:
    type: integer
    minimum: 1
    default: 1

PageSize:
  name: pageSize
  in: query
  description: Page size for pagination.
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 200
    default: 25

Search:
  name: search
  in: query
  description: Free-text search.
  required: false
  schema:
    type: string
    minLength: 1

InvoiceStatus:
  name: status
  in: query
  description: Filter invoices by status.
  required: false
  schema:
    $ref: "../schemas/fees.yaml#/InvoiceStatus"

From:
  name: from
  in: query
  description: Start date/time (inclusive), ISO-8601.
  required: false
  schema:
    type: string
    format: date-time

To:
  name: to
  in: query
  description: End date/time (inclusive), ISO-8601.
  required: false
  schema:
    type: string
    format: date-time

Date:
  name: date
  in: query
  description: Date (YYYY-MM-DD).
  required: false
  schema:
    type: string
    format: date

