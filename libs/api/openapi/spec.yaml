openapi: 3.1.0
info:
  title: Generic Operations Template API
  version: 0.3.0
  summary: Phase 1 (MVP) API contract for configurable organization operations.
  license:
    name: Proprietary
    identifier: UNLICENSED
  description: |
    OpenAPI specification for a domain-agnostic operations template.

    Current contract scope:
    - Platform bootstrap, health, preferences, and feature flags
    - Authentication, audit logs, and user/role management
    - Structure configuration
    - Entity & Profile Management
    - Presence tracking
    - Scheduling and allocation
    - Evaluations and scoring
    - Billing and collections
    - Staff, secondary contact, and member portal read models

    Notes:
    - Most endpoints require `bearerAuth` (JWT access token).
    - Scope enforcement is mandatory (e.g., staff only see assigned cohorts; secondary contacts only see linked members).
    - Error responses are standardized via `ErrorResponse`.

servers:
  - url: https://api.sms.example.org/api
    description: Production (example)
  - url: http://localhost:3000/api
    description: Local development

tags:
  - name: Health
    description: Health, liveness, and readiness endpoints.
  - name: Platform
    description: Application bootstrap, preferences, and shared client concerns.
  - name: Auth
    description: Authentication and password reset.
  - name: Me
    description: Current user identity, preferences, and staff self-service endpoints.
  - name: Users
    description: User lifecycle management (admin-only) and bulk import.
  - name: Roles
    description: Role and permission management (admin-only).
  - name: Audit
    description: Security and data-change audit log (admin-only).
  - name: Structure
    description: Structure & configuration (years/terms/levels/groups/topics/time slots/holidays).
  - name: Members
    description: Entity & Profile Management CRUD, membership basics, secondary contact linking.
  - name: Presence
    description: Presence sessions, bulk marking, reporting, and rules.
  - name: Evaluations
    description: Evaluations, components, marks entry, publishing, and results views.
  - name: Schedule
    description: Staff assignments, space inventory, schedule entries, and validation.
  - name: Billing
    description: Billing plans, invoices, payments, and member ledgers.
  - name: Portal
    description: Member and secondary contact portal read models and notifications.

