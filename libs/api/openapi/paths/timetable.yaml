/schedule/staff-assignments:
  get:
    operationId: listStaffAssignments
    tags: [Schedule]
    summary: List staff assignments.
    parameters:
      - $ref: "../spec.yaml#/components/parameters/CycleIdQuery"
      - $ref: "../spec.yaml#/components/parameters/TermIdQuery"
      - $ref: "../spec.yaml#/components/parameters/CohortIdQuery"
      - $ref: "../spec.yaml#/components/parameters/StaffUserIdQuery"
    responses:
      '200':
        description: Staff assignments returned.
        content:
          application/json:
            schema:
              $ref: "../spec.yaml#/components/schemas/StaffAssignmentListResponse"
      '401':
        $ref: "../components/responses/common.yaml#/Unauthorized"
  post:
    operationId: createStaffAssignment
    tags: [Schedule]
    summary: Create a staff assignment.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../spec.yaml#/components/schemas/CreateStaffAssignmentRequest"
    responses:
      '201':
        description: Staff assignment created.
        content:
          application/json:
            schema:
              $ref: "../spec.yaml#/components/schemas/StaffAssignmentResponse"
      '400':
        $ref: "../components/responses/common.yaml#/BadRequest"
      '401':
        $ref: "../components/responses/common.yaml#/Unauthorized"
      '409':
        $ref: "../components/responses/common.yaml#/Conflict"

/schedule/staff-assignments/{staffAssignmentId}:
  get:
    operationId: getStaffAssignment
    tags: [Schedule]
    summary: Get a staff assignment by id.
    parameters:
      - $ref: "../spec.yaml#/components/parameters/StaffAssignmentId"
    responses:
      '200':
        description: Staff assignment returned.
        content:
          application/json:
            schema:
              $ref: "../spec.yaml#/components/schemas/StaffAssignmentResponse"
      '401':
        $ref: "../components/responses/common.yaml#/Unauthorized"
      '404':
        $ref: "../components/responses/common.yaml#/NotFound"
  patch:
    operationId: updateStaffAssignment
    tags: [Schedule]
    summary: Update a staff assignment.
    parameters:
      - $ref: "../spec.yaml#/components/parameters/StaffAssignmentId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../spec.yaml#/components/schemas/UpdateStaffAssignmentRequest"
    responses:
      '200':
        description: Staff assignment updated.
        content:
          application/json:
            schema:
              $ref: "../spec.yaml#/components/schemas/StaffAssignmentResponse"
      '400':
        $ref: "../components/responses/common.yaml#/BadRequest"
      '401':
        $ref: "../components/responses/common.yaml#/Unauthorized"
      '404':
        $ref: "../components/responses/common.yaml#/NotFound"
      '409':
        $ref: "../components/responses/common.yaml#/Conflict"

