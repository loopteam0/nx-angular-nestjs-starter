/schedule/validate:
  post:
    operationId: validateSchedule
    tags: [Schedule]
    summary: Validate schedule entries for conflicts.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../spec.yaml#/components/schemas/ValidateScheduleRequest"
    responses:
      '200':
        description: Schedule validation result returned.
        content:
          application/json:
            schema:
              $ref: "../spec.yaml#/components/schemas/ValidateScheduleResponse"
      '400':
        $ref: "../components/responses/common.yaml#/BadRequest"
      '401':
        $ref: "../components/responses/common.yaml#/Unauthorized"

/schedule/publish:
  post:
    operationId: publishSchedule
    tags: [Schedule]
    summary: Publish schedule entries for a term.
    requestBody:
      required: true
