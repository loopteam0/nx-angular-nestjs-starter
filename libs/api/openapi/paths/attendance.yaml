/presence/sessions:
  get:
    operationId: listPresenceSessions
    tags: [Presence]
    summary: List presence sessions.
    parameters:
      - $ref: "../spec.yaml#/components/parameters/Date"
      - $ref: "../spec.yaml#/components/parameters/CohortIdQuery"
      - $ref: "../spec.yaml#/components/parameters/TopicIdQuery"
    responses:
      '200':
        description: Presence sessions returned.
        content:
          application/json:
            schema:
              $ref: "../spec.yaml#/components/schemas/PresenceSessionListResponse"
      '401':
        $ref: "../components/responses/common.yaml#/Unauthorized"
  post:
    operationId: createPresenceSession
    tags: [Presence]
    summary: Create an presence session.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../spec.yaml#/components/schemas/CreatePresenceSessionRequest"
    responses:
      '201':
        description: Presence session created.
        content:
          application/json:
            schema:
              $ref: "../spec.yaml#/components/schemas/PresenceSessionResponse"
      '400':
        $ref: "../components/responses/common.yaml#/BadRequest"
      '401':
        $ref: "../components/responses/common.yaml#/Unauthorized"
      '409':
        $ref: "../components/responses/common.yaml#/Conflict"

/presence/sessions/{presenceSessionId}:
  get:
    operationId: getPresenceSession
    tags: [Presence]
    summary: Get an presence session by id.
    parameters:
      - $ref: "../spec.yaml#/components/parameters/PresenceSessionId"
    responses:
      '200':
        description: Presence session returned.
        content:
          application/json:
            schema:
              $ref: "../spec.yaml#/components/schemas/PresenceSessionResponse"
      '401':
        $ref: "../components/responses/common.yaml#/Unauthorized"
      '404':
        $ref: "../components/responses/common.yaml#/NotFound"

/presence/sessions/{presenceSessionId}/records:
  put:
    operationId: bulkUpsertPresenceRecords
    tags: [Presence]
    summary: Save presence records for a session.
    parameters:
      - $ref: "../spec.yaml#/components/parameters/PresenceSessionId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../spec.yaml#/components/schemas/BulkUpsertPresenceRecordsRequest"
    responses:
      '200':
        description: Presence records saved.
        content:
          application/json:
            schema:
              $ref: "../spec.yaml#/components/schemas/BulkUpsertPresenceRecordsResponse"
      '400':
        $ref: "../components/responses/common.yaml#/BadRequest"
      '401':
        $ref: "../components/responses/common.yaml#/Unauthorized"
      '404':
        $ref: "../components/responses/common.yaml#/NotFound"
      '409':
        $ref: "../components/responses/common.yaml#/Conflict"

/presence/sessions/{presenceSessionId}/lock:
  post:
    operationId: lockPresenceSession
    tags: [Presence]
    summary: Lock an presence session against further edits.
    parameters:
      - $ref: "../spec.yaml#/components/parameters/PresenceSessionId"
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "../spec.yaml#/components/schemas/LockPresenceSessionRequest"
    responses:
      '200':
        description: Presence session locked.
        content:
          application/json:
            schema:
              $ref: "../spec.yaml#/components/schemas/PresenceSessionResponse"
      '401':
        $ref: "../components/responses/common.yaml#/Unauthorized"
      '404':
        $ref: "../components/responses/common.yaml#/NotFound"
      '409':
        $ref: "../components/responses/common.yaml#/Conflict"

