/members:
  get:
    operationId: listMembers
    tags: [Members]
    summary: List members.
    parameters:
      - $ref: "../spec.yaml#/components/parameters/Page"
      - $ref: "../spec.yaml#/components/parameters/PageSize"
      - $ref: "../spec.yaml#/components/parameters/Search"
      - $ref: "../spec.yaml#/components/parameters/CycleIdQuery"
      - $ref: "../spec.yaml#/components/parameters/CohortIdQuery"
      - name: status
        in: query
        required: false
        schema:
          $ref: "../spec.yaml#/components/schemas/MemberStatus"
    responses:
      '200':
        description: Members returned.
        content:
          application/json:
            schema:
              $ref: "../spec.yaml#/components/schemas/MemberListResponse"
      '401':
        $ref: "../components/responses/common.yaml#/Unauthorized"
      '403':
        $ref: "../components/responses/common.yaml#/Forbidden"
  post:
    operationId: createMember
    tags: [Members]
    summary: Create a member.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../spec.yaml#/components/schemas/CreateMemberRequest"
    responses:
      '201':
        description: Member created.
        content:
          application/json:
            schema:
              $ref: "../spec.yaml#/components/schemas/MemberResponse"
      '400':
        $ref: "../components/responses/common.yaml#/BadRequest"
      '401':
        $ref: "../components/responses/common.yaml#/Unauthorized"
      '403':
        $ref: "../components/responses/common.yaml#/Forbidden"
      '409':
        $ref: "../components/responses/common.yaml#/Conflict"

/members/{memberId}:
  get:
    operationId: getMember
    tags: [Members]
    summary: Get a member by id.
    parameters:
      - $ref: "../spec.yaml#/components/parameters/MemberId"
    responses:
      '200':
        description: Member returned.
        content:
          application/json:
            schema:
              $ref: "../spec.yaml#/components/schemas/MemberResponse"
      '401':
        $ref: "../components/responses/common.yaml#/Unauthorized"
      '403':
        $ref: "../components/responses/common.yaml#/Forbidden"
      '404':
        $ref: "../components/responses/common.yaml#/NotFound"
  patch:
    operationId: updateMember
    tags: [Members]
    summary: Update a member.
    parameters:
      - $ref: "../spec.yaml#/components/parameters/MemberId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../spec.yaml#/components/schemas/UpdateMemberRequest"
    responses:
      '200':
        description: Member updated.
        content:
          application/json:
            schema:
              $ref: "../spec.yaml#/components/schemas/MemberResponse"
      '400':
        $ref: "../components/responses/common.yaml#/BadRequest"
      '401':
        $ref: "../components/responses/common.yaml#/Unauthorized"
      '403':
        $ref: "../components/responses/common.yaml#/Forbidden"
      '404':
        $ref: "../components/responses/common.yaml#/NotFound"
      '409':
        $ref: "../components/responses/common.yaml#/Conflict"

