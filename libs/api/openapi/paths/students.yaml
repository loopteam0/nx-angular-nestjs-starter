/members:bulk-import:
  post:
    operationId: bulkImportMembers
    tags: [Members]
    summary: Import members from a file or supplied rows.
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: "../spec.yaml#/components/schemas/BulkImportMembersRequest"
        application/json:
          schema:
            $ref: "../spec.yaml#/components/schemas/BulkImportMembersRequest"
    responses:
      '200':
        description: Member import completed.
        content:
          application/json:
            schema:
